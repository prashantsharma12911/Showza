spring.application.name=demo
server.port = 5000

#Datasource config

spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME:showza}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Redis config (standalone, e.g. Redis Cloud); TLS off unless REDIS_SSL=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2000ms

#Connection pool (HikariCP), keep it small for db.t4g.micro
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1740000

# JPA config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#batch settings
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Fetch settings
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.max_fetch_depth=3


# SQL formatting and logging
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.generate_statistics=false

