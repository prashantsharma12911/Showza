spring.application.name=demo
server.port = 9090

#Datasource config
spring.datasource.url= jdbc:mysql://localhost:3306/localjdbc
spring.datasource.username=prashant
spring.datasource.password=poolpool
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Logging config for HikariCP
#logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.orm.connections.pooling=OFF


# --- HikariCP settings ---
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=true

# JPA config
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

#batch settings
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Fetch settings
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.max_fetch_depth=3


# SQL formatting and logging
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.generate_statistics=false

